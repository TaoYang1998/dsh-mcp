[package]
name = "dsh-mcp"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "A Rust MCP server for delegating coding tasks to DeepSeek Harness via ACP."

[dependencies]
agent-client-protocol = "3.4.0"
rmcp = { version = "3.5.1", features = ["server", "macros", "transport-io"] }
schemars = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "io-std", "sync", "time", "signal", "net"] }
tokio-util = { version = "0.7", features = ["compat", "codec"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
rustix = { version = "1", features = ["fs"] }
futures = "0.3"
libc = "0.2"
anyhow = "1"
thiserror = "2"

[dev-dependencies]
rmcp = { version = "3.5.1", features = ["server", "macros", "transport-io", "client"] }
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
